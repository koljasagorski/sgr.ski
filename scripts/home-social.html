<!doctype html>
<!-- Source of assets/og.png (1200 × 630). Render this local file with headless Chrome at
     device scale 1 once the fonts have loaded:
       "Google Chrome" --headless=new --hide-scrollbars --force-device-scale-factor=1 \
         --window-size=1200,630 --virtual-time-budget=5000 \
         --screenshot=assets/og.png file://$PWD/scripts/home-social.html
     Then shrink it to a 128-colour palette PNG (WhatsApp drops previews above ~300 KB):
       python3 scripts/og/quantize.py assets/og.png   (needs Pillow + imagequant; see the script)
     Background: scripts/og/bg.png, generated with Higgsfield (gpt_image_2_6), cropped to
     1200 × 630 and re-encoded without metadata. Portrait and text are real, laid over it here.
     Only the resulting PNG is published by scripts/build.sh. -->
<meta charset="utf-8">
<style>
@font-face{font-family:Sora;font-weight:700;src:url("../assets/fonts/sora-latin-700.woff2") format("woff2")}
@font-face{font-family:Inter;font-weight:400;src:url("../assets/fonts/inter-latin-400.woff2") format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url("../assets/fonts/inter-latin-600.woff2") format("woff2")}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;position:relative;color:#fff;
  background:#282830 url("og/bg.png") 0 0/1200px 630px no-repeat;font:400 30px/1.4 Inter}
.copy{position:absolute;left:80px;top:0;height:540px;width:560px;display:flex;flex-direction:column;justify-content:center}
h1{font:700 104px/1 Sora;letter-spacing:-.02em}
h1 span{display:block}
.gold{color:#E3BD52}
p{margin-top:32px;max-width:500px;color:#fff}
img{position:absolute;left:740px;top:80px;width:380px;height:380px;object-fit:cover;object-position:50% 40%;border-radius:16px}
.bar{position:absolute;left:0;right:0;bottom:0;height:90px;background:#1f1f25;display:flex;align-items:center;padding:0 80px;
  font:600 26px/1 Inter;color:#E3BD52}
</style>
<body>
<div class="copy">
  <h1><span>Kolja</span><span class="gold">Sagorski</span></h1>
  <p>Seit über 20 Jahren auf beiden Seiten der Firewall.</p>
</div>
<img src="../assets/portrait.webp" alt="">
<div class="bar">Certified Security Analyst · sgr.ski</div>
</body>
